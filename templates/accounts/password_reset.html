{% extends 'base_public.html' %}
{% block title %}Réinitialiser le mot de passe{% endblock %}
{% block content %}
<section class="min-h-[calc(100vh-4rem)] flex items-center justify-center px-4 py-10">
  <div class="max-w-md w-full bg-white border border-gray-200 rounded-2xl shadow-sm p-8">
    <h1 class="text-2xl font-extrabold text-gray-900 mb-1">Mot de passe oublié</h1>
    <p class="text-gray-500 text-sm mb-6">Saisissez votre email pour recevoir un lien de réinitialisation.</p>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div><label class="text-sm font-medium text-gray-700">Email</label>{{ form.email }}{{ form.email.errors }}</div>
      <button type="submit" class="w-full bg-mg-green hover:bg-mg-greenDark text-white font-semibold py-2.5 rounded-lg transition">Envoyer le lien</button>
    </form>
  </div>
</section>
{% endblock %}
