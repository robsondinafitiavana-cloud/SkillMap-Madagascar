{% extends 'base_public.html' %}
{% load icons %}
{% block content %}
<section class="min-h-[calc(100vh-4rem)] flex items-center justify-center px-4 text-center">
  <div class="max-w-md">
    <div class="w-14 h-14 mx-auto mb-3 rounded-full bg-mg-green/10 text-mg-green flex items-center justify-center">{% icon "check-circle" "w-7 h-7" %}</div>
    <h1 class="text-xl font-bold text-gray-900">Mot de passe réinitialisé</h1>
    <a href="{% url 'accounts:login' %}" class="inline-block mt-4 bg-mg-green text-white font-semibold px-5 py-2.5 rounded-lg">Se connecter</a>
  </div>
</section>
{% endblock %}
