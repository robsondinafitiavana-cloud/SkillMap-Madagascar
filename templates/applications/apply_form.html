{% extends 'base.html' %}
{% block title %}Postuler — {{ job.title }}{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto card-hover p-8">
  <h1 class="text-xl font-extrabold text-gray-900 mb-1">Postuler à « {{ job.title }} »</h1>
  <p class="text-sm text-gray-500 mb-6">{{ job.company.company_name }}</p>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div><label class="text-sm font-medium text-gray-700">Message de motivation</label>{{ form.message }}</div>
    <button type="submit" class="btn-accent">Envoyer ma candidature</button>
  </form>
</div>
{% endblock %}
