{% extends 'base.html' %}
{% block title %}{{ action }} un certificat{% endblock %}
{% block content %}
<h1 class="text-2xl font-extrabold text-gray-900 mb-6">{{ action }} un certificat</h1>
<div class="card-hover p-6 max-w-2xl">
  <form method="post" enctype="multipart/form-data" class="space-y-4">
    {% csrf_token %}
    <div><label class="text-sm font-medium text-gray-700">Nom du certificat</label>{{ form.title }}</div>
    <div><label class="text-sm font-medium text-gray-700">Organisme</label>{{ form.organization }}</div>
    <div><label class="text-sm font-medium text-gray-700">Date d'obtention</label>{{ form.issue_date }}</div>
    <div class="grid grid-cols-2 gap-4">
      <div><label class="text-sm font-medium text-gray-700">Fichier PDF</label>{{ form.file }}</div>
      <div><label class="text-sm font-medium text-gray-700">Image</label>{{ form.image }}</div>
    </div>
    <button type="submit" class="btn-primary">Enregistrer</button>
  </form>
</div>
{% endblock %}
