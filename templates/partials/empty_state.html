{% load icons %}
<div class="text-center py-14 px-6">
  <div class="w-14 h-14 mx-auto mb-4 rounded-2xl bg-gray-50 text-gray-300 flex items-center justify-center">
    {% icon icon_name|default:"inbox" "w-7 h-7" %}
  </div>
  <p class="text-gray-500 text-sm font-medium">{{ title }}</p>
  {% if subtitle %}<p class="text-gray-400 text-xs mt-1.5 max-w-xs mx-auto">{{ subtitle }}</p>{% endif %}
  {% if cta_url %}<a href="{{ cta_url }}" class="btn-primary btn-sm mt-5 inline-flex">{{ cta_label }}</a>{% endif %}
</div>
