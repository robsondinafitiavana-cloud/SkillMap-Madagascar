{% if messages %}
<div class="max-w-md mx-auto mt-4 space-y-2 px-4">
  {% for message in messages %}
  <div class="px-4 py-3 rounded-lg text-sm font-medium border
    {% if message.tags == 'success' %}bg-green-50 text-mg-green border-green-200
    {% elif message.tags == 'error' %}bg-red-50 text-mg-red border-red-200
    {% else %}bg-blue-50 text-blue-700 border-blue-200{% endif %}">
    {{ message }}
  </div>
  {% endfor %}
</div>
{% endif %}
