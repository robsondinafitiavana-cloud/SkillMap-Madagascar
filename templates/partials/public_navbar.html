<header class="bg-white/90 backdrop-blur border-b border-gray-100 sticky top-0 z-30">
  {% load icons %}
  <div class="max-w-7xl mx-auto px-4 md:px-6 h-16 flex items-center justify-between">
    <a href="{% url 'root' %}" class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-mg-red to-mg-green flex items-center justify-center text-white font-bold text-sm">SM</div>
      <span class="font-bold text-gray-900 text-lg">SkillMap<span class="text-mg-red">.</span> Madagascar</span>
    </a>
    <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-gray-600">
      <a href="{% url 'students:leaderboard' %}" class="flex items-center gap-1.5 hover:text-mg-red">{% icon "trophy" "w-4 h-4" %} Classement</a>
      <a href="{% url 'students:student_directory' %}" class="hover:text-mg-green">Étudiants</a>
      <a href="{% url 'companies:company_directory' %}" class="hover:text-mg-red">Entreprises</a>
      <a href="{% url 'jobs:job_list' %}" class="hover:text-gray-900">Offres</a>
    </nav>
    <div class="flex items-center gap-3">
      {% if user.is_authenticated %}
      <a href="{% url 'dashboard:home' %}" class="text-sm font-medium text-gray-600 hover:text-mg-green px-3 py-2">Mon tableau de bord</a>
      <form action="{% url 'accounts:logout' %}" method="post" class="inline">
        {% csrf_token %}
        <button type="submit" class="text-sm font-semibold bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg transition">Déconnexion</button>
      </form>
      {% else %}
      <a href="{% url 'accounts:login' %}" class="text-sm font-medium text-gray-600 hover:text-mg-red px-3 py-2">Connexion</a>
      <a href="{% url 'accounts:choose_role' %}" class="btn-accent">S'inscrire</a>
      {% endif %}
    </div>
  </div>
</header>
