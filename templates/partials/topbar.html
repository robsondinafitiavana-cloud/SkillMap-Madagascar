<header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-4 md:px-6 sticky top-0 z-20">
  <div class="flex items-center gap-2 lg:hidden">
    <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-mg-red to-mg-green flex items-center justify-center text-white font-bold text-xs">SM</div>
    <span class="font-bold text-gray-900">SkillMap</span>
  </div>
  <div class="hidden md:block text-sm text-gray-400">
    {% if user.is_student %}Espace étudiant{% elif user.is_company %}Espace entreprise{% else %}Espace administrateur{% endif %}
  </div>
  <div class="flex items-center gap-4">
    <a href="{% url 'notifications:notification_list' %}" class="relative text-gray-500 hover:text-mg-red">
      <span class="text-xl">🔔</span>
      {% if unread_notifications_count > 0 %}
      <span class="absolute -top-1 -right-1 bg-mg-red text-white text-[10px] font-bold rounded-full w-4 h-4 flex items-center justify-center">{{ unread_notifications_count }}</span>
      {% endif %}
    </a>
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-full bg-mg-green/10 text-mg-green flex items-center justify-center font-semibold text-sm">
        {{ user.username|slice:":1"|upper }}
      </div>
      <span class="hidden md:inline text-sm font-medium text-gray-700">{{ user.username }}</span>
    </div>
  </div>
</header>
